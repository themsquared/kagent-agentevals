name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
      # The quickstart suite needs no cluster and no API key, so CI runs the
      # real evaluators against the checked-in fixture.
      - run: kagent-evals run suites/quickstart.yaml
      # The customer demo is a deliverable, so CI runs it end to end.
      - run: ./demo/run.sh --fast
        env:
          NO_COLOR: "1"
